services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Postgres corre como servicio aparte en Dokploy (grillo-mailing-db), no
      # como parte de este compose. Se alcanza por hostname en dokploy-network.
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}
      # Cifra las credenciales de Resend que cada cliente pega en la app.
      # Si se pierde o se cambia, hay que volver a pegarlas todas.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Password del admin en el seed inicial. Si no se define, el seed genera
      # una clave aleatoria y la imprime en los logs del contenedor.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - dokploy-network
    restart: unless-stopped

  # Optional: Cron service for scheduled campaigns
  # Uncomment if you want automatic scheduling inside Docker
  # cron:
  #   image: alpine/curl
  #   command: >
  #     sh -c "echo '* * * * * curl -s -f $$NEXTAUTH_URL/api/campaigns/scheduled/send > /dev/null 2>&1' | crontab - && crond -f"
  #   environment:
  #     - NEXTAUTH_URL=${NEXTAUTH_URL}
  #   depends_on:
  #     - app

networks:
  # Red que Dokploy usa para Traefik y para los servicios de base de datos.
  # Es externa: la crea Dokploy, no este compose.
  dokploy-network:
    external: true
