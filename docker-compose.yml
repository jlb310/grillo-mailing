services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Postgres corre como servicio aparte en Dokploy (grillo-mailing-db), no
      # como parte de este compose. Se alcanza por hostname en dokploy-network.
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Signing secret del webhook de la cuenta Resend de Grillo. Sin esto en la
      # lista, la variable puede estar en Dokploy y NUNCA llegar al contenedor:
      # el webhook responde 400 y no se registra ninguna apertura ni clic de las
      # empresas que envían por la cuenta compartida. Las que tienen cuenta
      # propia no dependen de él (su secreto va cifrado en la base).
      - SVIX_SECRET=${SVIX_SECRET}
      # Cifra las credenciales de Resend que cada cliente pega en la app.
      # Si se pierde o se cambia, hay que volver a pegarlas todas.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Password del admin creado por prisma/setup.js. Si no se define, usa grillo2026.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Admin de la empresa Lenyes que crea prisma/setup.js. Sin estas vars solo
      # existe el super admin (admin@grillo.click, rol SUPER_ADMIN).
      - LENYES_ADMIN_EMAIL=${LENYES_ADMIN_EMAIL}
      - LENYES_ADMIN_PASSWORD=${LENYES_ADMIN_PASSWORD}
      - LENYES_ADMIN_NAME=${LENYES_ADMIN_NAME}
    volumes:
      # Uploads locales (logos, programas) viven en /app/public y se sirven
      # públicamente por la app; los volúmenes evitan que se pierdan al redeploy.
      # Nombres *_data: al ser nuevos, Docker los crea heredando el ownership
      # nextjs de las carpetas en la imagen (requisito: chown en Dockerfile).
      - logos_data:/app/public/logos
      - programas_data:/app/public/programas
      - uploads_data:/app/public/uploads
      - productos_data:/app/public/productos
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  # Red que Dokploy usa para Traefik y para los servicios de base de datos.
  # Es externa: la crea Dokploy, no este compose.
  dokploy-network:
    external: true

volumes:
  logos_data:
  programas_data:
  uploads_data:
  productos_data:
