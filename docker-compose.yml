services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Postgres corre como servicio aparte en Dokploy (grillo-mailing-db), no
      # como parte de este compose. Se alcanza por hostname en dokploy-network.
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Remitente compartido: el que usan las empresas que todavía no tienen
      # dominio propio dado de alta. Sin esta línea la variable puede estar en
      # Dokploy y nunca llegar al contenedor — se cae al default de lib/sender.ts
      # ("Grillo <no-reply@grillo.click>"), que además es el dominio que el
      # script de arranque intenta configurar. Es también el dominio que
      # diagnostica setup-resend-tracking.ts en cada deploy.
      - RESEND_FROM=${RESEND_FROM}
      # Destinatarios de los correos de operación (Envío completado /
      # Estadísticas 24h) cuando la campaña no define notifyEmails.
      # Default: hola@grillo.click.
      - REPORT_FALLBACK_EMAILS=${REPORT_FALLBACK_EMAILS}
      # Solo para el arranque de una cuenta Resend NUEVA: con valor "1", el
      # script del entrypoint crea el webhook y escribe su signing secret en el
      # log UNA sola vez, para copiarlo a SVIX_SECRET. Dejar vacío después: con
      # el secreto ya guardado, el script solo diagnostica y confirma que
      # SVIX_SECRET coincide con el del webhook.
      - CREATE_RESEND_WEBHOOK=${CREATE_RESEND_WEBHOOK}
      # Signing secret del webhook de la cuenta Resend de Grillo. Sin esto en la
      # lista, la variable puede estar en Dokploy y NUNCA llegar al contenedor:
      # el webhook responde 400 y no se registra ninguna apertura ni clic de las
      # empresas que envían por la cuenta compartida. Las que tienen cuenta
      # propia no dependen de él (su secreto va cifrado en la base).
      - SVIX_SECRET=${SVIX_SECRET}
      # NO ROTAR AL CAMBIAR DE CUENTA RESEND. Cifra dos cosas, y la segunda es
      # la que duele: (1) las credenciales Resend que cada cliente pega en la
      # app —se vuelven a pegar y listo—, y (2) el token de cada link de baja,
      # que es encrypt(sendLogId). Los correos YA ENVIADOS llevan ese token
      # dentro; cambiar la clave deja sin efecto el link de baja de toda campaña
      # que siga en la bandeja de alguien, que es justo lo que Gmail y Yahoo
      # exigen. No hay migración: es base64 de 32 bytes y no se deriva de nada.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Password del admin creado por prisma/setup.js. Si no se define, usa grillo2026.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Admin de la empresa Lenyes que crea prisma/setup.js. Sin estas vars solo
      # existe el super admin (admin@grillo.click, rol SUPER_ADMIN).
      - LENYES_ADMIN_EMAIL=${LENYES_ADMIN_EMAIL}
      - LENYES_ADMIN_PASSWORD=${LENYES_ADMIN_PASSWORD}
      - LENYES_ADMIN_NAME=${LENYES_ADMIN_NAME}
    volumes:
      # Uploads locales (logos, programas) viven en /app/public y se sirven
      # públicamente por la app; los volúmenes evitan que se pierdan al redeploy.
      # Nombres *_data: al ser nuevos, Docker los crea heredando el ownership
      # nextjs de las carpetas en la imagen (requisito: chown en Dockerfile).
      - logos_data:/app/public/logos
      - programas_data:/app/public/programas
      - uploads_data:/app/public/uploads
      - productos_data:/app/public/productos
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  # Red que Dokploy usa para Traefik y para los servicios de base de datos.
  # Es externa: la crea Dokploy, no este compose.
  dokploy-network:
    external: true

volumes:
  logos_data:
  programas_data:
  uploads_data:
  productos_data:
